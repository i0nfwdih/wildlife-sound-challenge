<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wildlife Week — Signal Hunt</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(80, 120, 70, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(180, 150, 60, 0.12),
          transparent 30%
        ),
        #0b0d0b;

      color: #f2f2e9;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .top-label {
      font-size: 11px;
      letter-spacing: 4px;
      opacity: 0.55;
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .card {
      border: 1px solid rgba(255,255,255,0.13);

      background:
        rgba(20, 23, 19, 0.94);

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 20px 70px rgba(0,0,0,0.45);
    }

    /* =========================
       NAME SCREEN
    ========================= */

    #nameScreen {
      text-align: center;
    }

    .mini-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: #92998b;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(34px, 10vw, 52px);
      line-height: 0.92;
      letter-spacing: -2.5px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #aeb4a7;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .name-input {
      width: 100%;

      padding: 16px;

      border-radius: 13px;

      border: 1px solid rgba(255,255,255,0.14);

      background: #11140f;

      color: white;

      font-size: 16px;

      outline: none;

      text-align: center;
    }

    .name-input:focus {
      border-color: rgba(255,255,255,0.4);
    }

    .start-button {
      width: 100%;

      margin-top: 12px;

      border: none;

      border-radius: 13px;

      padding: 16px;

      background: #e7eadf;

      color: #11140f;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;
    }

    .start-button:active {
      transform: scale(0.97);
    }

    .name-error {
      display: none;

      margin-top: 10px;

      color: #d78383;

      font-size: 12px;
    }

    /* =========================
       GAME SCREEN
    ========================= */

    #gameScreen {
      display: none;
    }

    .agent {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

      padding-bottom: 15px;

      border-bottom:
        1px solid rgba(255,255,255,0.08);
    }

    .agent-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: #777f72;
    }

    .agent-name {
      font-size: 13px;
      font-weight: 800;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .points {
      text-align: right;

      font-size: 10px;

      letter-spacing: 2px;

      color: #92998b;
    }

    .signal {
      border:
        1px solid rgba(255,255,255,0.12);

      border-radius: 18px;

      padding: 25px 15px;

      text-align: center;

      background:
        rgba(255,255,255,0.025);

      margin-bottom: 22px;
    }

    .signal-number {
      font-size: 10px;

      letter-spacing: 3px;

      color: #9aa58d;

      margin-bottom: 18px;
    }

    .sound-icon {
      width: 76px;
      height: 76px;

      margin: 0 auto 18px;

      border-radius: 50%;

      display: flex;

      justify-content: center;

      align-items: center;

      font-size: 30px;

      background:
        rgba(255,255,255,0.08);

      border:
        1px solid rgba(255,255,255,0.12);
    }

    .status {
      font-size: 12px;

      color: #aeb4a7;

      margin-bottom: 18px;
    }

    button {
      width: 100%;

      border: none;

      border-radius: 13px;

      padding: 15px;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .play-button {
      background: #e7eadf;

      color: #11140f;
    }

    .play-button:hover {
      background: white;
    }

    /* =========================
       ANSWER
    ========================= */

    .question {
      margin-top: 25px;

      font-size: 12px;

      letter-spacing: 2px;

      color: #92998b;

      text-transform: uppercase;

      text-align: center;
    }

    .answer-input {
      margin-top: 14px;
    }

    .answer-input input {
      width: 100%;

      padding: 16px;

      border-radius: 13px;

      border:
        1px solid rgba(255,255,255,0.13);

      background: #11140f;

      color: white;

      font-size: 16px;

      outline: none;

      text-align: center;
    }

    .answer-input input:focus {
      border-color:
        rgba(255,255,255,0.4);
    }

    .submit-button {
      margin-top: 10px;

      background:
        #dfe4d6;

      color:
        #11140f;
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      text-align: center;

      background:
        rgba(255,255,255,0.05);
    }

    .result-title {
      font-size: 18px;

      font-weight: 800;

      margin-bottom: 6px;
    }

    .result-text {
      font-size: 13px;

      color: #aeb4a7;
    }

    .next-button {
      margin-top: 15px;

      background: transparent;

      color: #f2f2e9;

      border:
        1px solid rgba(255,255,255,0.2);
    }

    .warning {
      font-size: 10px;

      color: #6e7569;

      text-align: center;

      margin-top: 18px;

      line-height: 1.5;
    }

    @media (max-width: 380px) {

      .card {
        padding: 23px 17px;
      }

    }

  </style>
</head>


<body>

  <main class="container">

    <div class="top-label">
      Wildlife Week • Zoology
    </div>


    <section class="card">


      <!-- =========================
           NAME SCREEN
      ========================= -->

      <div id="nameScreen">

        <div class="mini-label">
          WILDLIFE FIELD CHALLENGE
        </div>

        <h1>
          Signal Hunt.
        </h1>

        <p class="subtitle">
          Something in the wild is calling.
          <br>
          Can you identify it?
        </p>

        <input
          type="text"
          id="nameInput"
          class="name-input"
          placeholder="Enter your name"
          maxlength="30"
          autocomplete="off"
        >

        <button
          class="start-button"
          id="startButton"
        >
          ENTER THE FIELD
        </button>

        <div
          class="name-error"
          id="nameError"
        >
          Enter your name to continue.
        </div>

      </div>



      <!-- =========================
           GAME SCREEN
      ========================= -->

      <div id="gameScreen">


        <div class="agent">

          <div>

            <div class="agent-label">
              FIELD AGENT
            </div>

            <div
              class="agent-name"
              id="agentName"
            >
            </div>

          </div>


          <div>

            <div class="points">
              FIELD POINTS
            </div>

            <div
              class="points"
              id="score"
            >
              0
            </div>

          </div>

        </div>



        <div class="signal">

          <div
            class="signal-number"
            id="signalNumber"
          >
            WILDLIFE SIGNAL
          </div>


          <div class="sound-icon">
            🔊
          </div>


          <div
            class="status"
            id="status"
          >
            Signal ready.
          </div>


          <button
            class="play-button"
            id="playButton"
          >
            PLAY SIGNAL
          </button>

        </div>



        <div class="question">
          What did you hear?
        </div>


        <div class="answer-input">

          <input
            type="text"
            id="answerInput"
            placeholder="Type the animal..."
            autocomplete="off"
            maxlength="30"
          >

          <button
            class="submit-button"
            id="submitButton"
          >
            IDENTIFY SIGNAL
          </button>

        </div>



        <div
          class="result"
          id="result"
        >

          <div
            class="result-title"
            id="resultTitle"
          >
          </div>

          <div
            class="result-text"
            id="resultText"
          >
          </div>

          <button
            class="next-button"
            id="nextButton"
          >
            NEW SIGNAL
          </button>

        </div>


        <div class="warning">
          Headphones recommended.
          Keep your volume comfortable.
        </div>


      </div>

    </section>

  </main>



<script>


  /* =========================================
     ANIMAL DATABASE
  ========================================= */

  const animals = [

    {
      name: "Tiger",
      file: "sounds/tiger.mp3"
    },

    {
      name: "Elephant",
      file: "sounds/elephant.mp3"
    },

    {
      name: "Owl",
      file: "sounds/owl.mp3"
    },

    {
      name: "Frog",
      file: "sounds/frog.mp3"
    },

    {
      name: "Eagle",
      file: "sounds/eagle.mp3"
    },

    {
      name: "Peacock",
      file: "sounds/peacock.mp3"
    },

    {
      name: "Wolf",
      file: "sounds/wolf.mp3"
    },

    {
      name: "Monkey",
      file: "sounds/monkey.mp3"
    },

    {
      name: "Whale",
      file: "sounds/whale.mp3"
    },

    {
      name: "Leopard",
      file: "sounds/leopard.mp3"
    }

  ];


  /* =========================================
     GAME VARIABLES
  ========================================= */

  let participantName = "";

  let currentAnimal = null;

  let previousAnimal = null;

  let score = 0;

  let signalCount = 0;

  let answered = false;


  const audio = new Audio();


  /* =========================================
     RANDOM ANIMAL
  ========================================= */

  function chooseRandomAnimal() {

    let available =
      animals.filter(
        animal =>
          animal.name !== previousAnimal
      );

    const randomIndex =
      Math.floor(
        Math.random() *
        available.length
      );

    currentAnimal =
      available[randomIndex];

    previousAnimal =
      currentAnimal.name;

  }


  /* =========================================
     NEW SIGNAL
  ========================================= */

  function newSignal() {

    answered = false;

    signalCount++;

    chooseRandomAnimal();

    audio.src =
      currentAnimal.file;


    document.getElementById(
      "signalNumber"
    ).textContent =
      "WILDLIFE SIGNAL " +
      String(signalCount).padStart(2, "0");


    document.getElementById(
      "status"
    ).textContent =
      "New signal detected. Listen carefully.";


    document.getElementById(
      "result"
    ).style.display =
      "none";


    const input =
      document.getElementById(
        "answerInput"
      );


    input.value = "";

    input.disabled = false;


    document.getElementById(
      "submitButton"
    ).disabled = false;

  }


  /* =========================================
     PLAY SOUND
  ========================================= */

  function playSound() {

    audio.currentTime = 0;


    audio.play()

      .then(() => {

        document.getElementById(
          "status"
        ).textContent =
          "Signal playing...";

      })

      .catch(() => {

        document.getElementById(
          "status"
        ).textContent =
          "Tap PLAY SIGNAL to hear the sound.";

      });

  }


  /* =========================================
     CHECK ANSWER
  ========================================= */

  function checkAnswer() {

    if (answered) return;


    const input =
      document.getElementById(
        "answerInput"
      );


    const answer =
      input.value
        .trim()
        .toLowerCase();


    if (!answer) {

      input.focus();

      return;

    }


    answered = true;


    input.disabled = true;


    document.getElementById(
      "submitButton"
    ).disabled = true;


    const correctAnswer =
      currentAnimal.name
        .toLowerCase();


    if (
      answer ===
      correctAnswer
    ) {

      score++;


      document.getElementById(
        "resultTitle"
      ).textContent =
        "✓ SIGNAL IDENTIFIED";


      document.getElementById(
        "resultText"
      ).textContent =
        "Correct. +1 field point.";

    }

    else {

      document.getElementById(
        "resultTitle"
      ).textContent =
        "✕ SIGNAL MISIDENTIFIED";


      document.getElementById(
        "resultText"
      ).textContent =
        "The signal was a " +
        currentAnimal.name +
        ".";

    }


    document.getElementById(
      "score"
    ).textContent =
      score;


    document.getElementById(
      "result"
    ).style.display =
      "block";

  }


  /* =========================================
     START CHALLENGE
  ========================================= */

  function startChallenge() {

    const input =
      document.getElementById(
        "nameInput"
      );


    const name =
      input.value.trim();


    if (!name) {

      document.getElementById(
        "nameError"
      ).style.display =
        "block";

      input.focus();

      return;

    }


    participantName = name;


    document.getElementById(
      "agentName"
    ).textContent =
      participantName;


    document.getElementById(
      "nameScreen"
    ).style.display =
      "none";


    document.getElementById(
      "gameScreen"
    ).style.display =
      "block";


    newSignal();

  }


  /* =========================================
     BUTTONS
  ========================================= */

  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      startChallenge
    );


  document
    .getElementById("playButton")
    .addEventListener(
      "click",
      playSound
    );


  document
    .getElementById("submitButton")
    .addEventListener(
      "click",
      checkAnswer
    );


  document
    .getElementById("nextButton")
    .addEventListener(
      "click",
      newSignal
    );


  /* =========================================
     ENTER KEY
  ========================================= */

  document
    .getElementById("nameInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          startChallenge();

        }

      }
    );


  document
    .getElementById("answerInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          checkAnswer();

        }

      }
    );


</script>

</body>
</html>
